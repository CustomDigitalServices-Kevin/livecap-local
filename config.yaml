# Configuration par defaut de LiveCap Local. Voir CONTRACT.md pour le schema
# complet et livecap/config.py pour la validation.

# Langue cible de la traduction. L'autre langue (fr <-> en) est detectee
# implicitement par le modele ASR bilingue Kyutai stt-1b-en_fr.
target_lang: fr

devices:
  # "auto" selectionne le premier peripherique WASAPI loopback par defaut.
  loopback: auto
  # "auto" selectionne le micro par defaut. "none" desactive la capture micro
  # (sous-titrage de l'audio systeme uniquement).
  mic: auto

overlay:
  # top-left | top-center | top-right | bottom-left | bottom-center | bottom-right
  position: bottom-center
  font_size: 22
  # Si true, l'overlay laisse passer les clics souris (WS_EX_TRANSPARENT).
  click_through: false
  # Nombre de segments precedents conserves a l'affichage sous la ligne active.
  # L'overlay affiche au plus 45% de la hauteur d'ecran et devient scrollable
  # a la molette au-dela : cette valeur borne la profondeur d'historique
  # remontable pendant une reunion.
  history: 400

# Si true, ecrit le transcript horodate (VO + traduction) dans transcripts/.
log_transcript: false

# Traduction. Modifiable en cours de session via la roue dentee de l'overlay ;
# ce que tu y choisis est enregistre dans settings.local.yaml (fusionne
# par-dessus ce fichier au demarrage, supprimer ce fichier annule tes choix).
translation:
  # qwen3:4b-instruct  : ~126 ms, tient en VRAM avec l'ASR charge.
  # qwen3:14b-q4_K_M   : meilleurs pronoms, mais ~351 ms avec l'ASR charge
  #                      et VRAM a 94% (Ollama bascule 11% sur CPU).
  model: qwen3:4b-instruct
  # Phrases precedentes rejouees comme contexte (0 a 5). Aide les termes
  # ambigus (board = conseil), sans effet mesurable sur le reste.
  context_turns: 0
